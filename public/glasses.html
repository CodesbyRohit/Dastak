<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Home visit protocol companion for field health workers">
<link rel="icon" type="image/png" href="/icon-96.png">
<title>Dastak</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font-family:ui-monospace,"SF Mono",Menlo,monospace;-webkit-font-smoothing:antialiased}

#app{width:600px;height:600px;display:flex;flex-direction:column;position:relative}

/* Context band */
#context{height:72px;padding:0 24px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid #5A6570;flex-shrink:0}
#context .label{font-size:16px;color:#5A6570;letter-spacing:1px;text-transform:uppercase}
#context .step-info{font-size:16px;color:#5A6570;text-align:right}
#context .header-row{display:flex;justify-content:space-between;align-items:center}
#progress-track{width:100%;height:2px;background:#1a1a1a;margin-top:8px;flex-shrink:0}
#progress-fill{height:100%;background:#00E5FF;width:0;transition:width 0.3s ease}

/* Main question area */
#question-area{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center}
#prompt-text{font-size:36px;text-align:center;line-height:1.3;color:#fff;max-width:540px}

/* Options area */
#options{padding:0 24px 24px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}

/* FIX 1: All interactive elements are <button> with min-height 88px */
.option-btn{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:28px;
  min-height:88px;
  padding:12px 20px;
  border:1px solid #5A6570;
  color:#5A6570;
  background:#000;
  cursor:pointer;
  text-align:center;
  user-select:none;
  transition:all 0.15s ease;
  outline:none;
}
.option-btn.selected,
.option-btn:focus{
  color:#fff;
  border-color:#00E5FF;
  box-shadow:0 0 0 2px #00E5FF;
}
.option-btn:active{
  background:#1a1a1a;
}

/* Count step */
#count-display{font-size:72px;color:#fff;text-align:center;margin:16px 0}
#count-unit{font-size:16px;color:#5A6570;text-align:center}
#count-controls{display:flex;justify-content:center;gap:24px;margin-top:16px}

/* Count buttons */
.count-btn{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:36px;
  min-height:88px;
  min-width:88px;
  padding:12px 20px;
  border:1px solid #5A6570;
  color:#5A6570;
  background:#000;
  cursor:pointer;
  text-align:center;
  user-select:none;
  outline:none;
  transition:all 0.15s ease;
}
.count-btn:focus{
  color:#fff;
  border-color:#00E5FF;
  box-shadow:0 0 0 2px #00E5FF;
}
.count-btn:active{
  background:#1a1a1a;
}
.count-btn.confirm{
  color:#00E5FF;
  border-color:#00E5FF;
}
.count-btn.confirm:focus{
  box-shadow:0 0 0 2px #00E5FF;
}

/* Danger frame */
.danger-frame{background:#000;border:2px solid #E5484D;padding:24px}
.danger-frame #prompt-text{color:#E5484D}
.danger-frame .referral-text{font-size:28px;color:#fff;margin-top:16px;text-align:center}
.danger-badge{font-size:16px;color:#E5484D;letter-spacing:1px;text-transform:uppercase}

/* Completion */
#complete-area{padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
#complete-area .done-label{font-size:16px;color:#00E5FF;letter-spacing:1px;text-transform:uppercase}
#complete-area .done-text{font-size:28px;color:#fff}
#complete-area .done-stats{font-size:16px;color:#5A6570;margin-top:8px}
#complete-area .done-sync{font-size:16px;color:#5A6570;margin-top:16px}

/* Bottom controls */
#controls{height:192px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;border-top:1px solid #5A6570;flex-shrink:0}
#controls .control-row{display:flex;justify-content:space-between;font-size:16px;color:#5A6570}
#controls .key{color:#00E5FF}
#controls .action{color:#5A6570}
#controls .enter-row{margin-top:8px}

/* Offline marker */
#offline-marker{position:absolute;top:8px;right:24px;font-size:16px;color:#5A6570;display:none}

/* Carry-forward hint (Property 4) */
#carry-forward{font-size:16px;color:#00E5FF;margin-top:12px;opacity:0.7}

/* Idle state */
#idle-area{padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px}
#idle-area .idle-household{font-size:36px;color:#fff}
#idle-area .idle-protocol{font-size:16px;color:#5A6570;margin-top:4px}
#idle-area .idle-triage{font-size:16px;color:#00E5FF;margin-top:8px;font-style:italic}
#idle-area .idle-carry{font-size:16px;color:#5A6570;margin-top:8px}

/* FIX 1: Begin button is a real <button> */
#idle-start{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:28px;
  min-height:88px;
  color:#00E5FF;
  background:#000;
  border:1px solid #00E5FF;
  padding:16px 48px;
  cursor:pointer;
  outline:none;
  transition:all 0.15s ease;
}
#idle-start:focus{
  box-shadow:0 0 0 2px #00E5FF;
  background:#1a1a1a;
}
#idle-start:active{
  background:#0d2a2a;
}

#idle-controls{font-size:16px;color:#5A6570;margin-top:8px}

/* Resume indicator (Property 2) */
#resume-indicator{font-size:16px;color:#00E5FF;margin-top:12px;opacity:0.8}

/* Visually hidden */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div id="app" role="main" aria-label="Dastak health visit application">

  <div id="context" role="banner">
    <div class="header-row">
      <span id="protocol-label" class="label">HBNC · DAY 7</span>
      <span id="step-info" class="step-info"></span>
    </div>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>

  <div id="question-area">
    <!-- IDLE: zero-query launch frame (Property 1) -->
    <div id="idle-area">
      <div id="idle-household" class="idle-household"></div>
      <div id="idle-protocol" class="idle-protocol"></div>
      <div id="idle-triage" class="idle-triage"></div>
      <div id="idle-carry" class="idle-carry"></div>
      <!-- FIX 1: Real <button> for begin -->
      <button id="idle-start" role="button" aria-label="Begin visit">⟩ ENTER to begin</button>
      <div id="idle-controls" class="idle-controls">→ different household</div>
    </div>

    <div id="prompt-text" role="heading" aria-level="2" style="display:none"></div>

    <div id="carry-forward" style="display:none"></div>

    <div id="options" style="display:none"></div>

    <div id="count-display" style="display:none"></div>
    <div id="count-unit" style="display:none"></div>

    <div id="resume-indicator" style="display:none"></div>

    <div id="complete-area" style="display:none">
      <div class="done-label">COMPLETE</div>
      <div class="done-text">Visit recorded.</div>
      <div id="done-stats" class="done-stats"></div>
      <div id="done-sync" class="done-sync"></div>
    </div>
  </div>

  <div id="controls">
    <div id="controls-idle" class="control-row">
      <span><span class="key">ENTER</span> <span class="action">begin visit</span></span>
    </div>
    <div id="controls-step" class="control-row" style="display:none">
      <span><span class="key">← →</span> <span class="action">choose</span></span>
      <span><span class="key">↑ back</span></span>
    </div>
    <div class="enter-row" id="enter-row-step" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">confirm</span></span>
    </div>
    <div id="controls-count" class="control-row" style="display:none">
      <span><span class="key">↑ ↓</span> <span class="action">adjust</span></span>
    </div>
    <div class="enter-row" id="enter-row-count" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">confirm</span></span>
    </div>
    <div id="controls-info" class="control-row" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">continue the visit</span></span>
    </div>
    <div id="controls-danger" class="control-row" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">continue the visit</span></span>
    </div>
    <div id="controls-complete" class="control-row" style="display:none">
      <span><span class="key">↑ back</span> <span class="action">to previous step</span></span>
    </div>
  </div>

  <div id="offline-marker">saved locally</div>

</div>

<script>
// ============================================================
// DASTAK — glasses.html
// NO fetch. NO XMLHttpRequest post-startup. NO navigator.sendBeacon.
// This file is verified by grep at demo time.
//
// One XHR at startup loads the protocol step graph.
// Everything else is in-memory from embedded data + localStorage.
//
// FIX 1: All input goes through real DOM focus.
// Neural Band pinch dispatches Enter to document.activeElement.
// Arrow keys call .focus() on real elements.
// Enter activates document.activeElement, never a cached index.
// ============================================================

// --- Embedded roster (Property 1: zero-query launch) ---
var ROSTER = [
  {"id":"H-104","area":"Sector 3","protocol":"HBNC Day 7","protocolId":"hbnc_day7","dueIn":0,"lastFlag":"low temp","steps":["weight","feeding","flag_feeding","temp","flag_temp","cord","flag_cord","activity","flag_activity","counselling"]},
  {"id":"H-112","area":"Sector 3","protocol":"HBNC Day 21","protocolId":"hbnc_day21","dueIn":1,"lastFlag":null,"steps":["weight","feeding","temp","cord","activity","counselling"]},
  {"id":"H-087","area":"Sector 7","protocol":"ANC month 6","protocolId":"anc_month6","dueIn":-2,"lastFlag":null,"steps":["weight","haemoglobin","blood_pressure","counselling"]},
  {"id":"H-201","area":"Sector 5","protocol":"HBNC Day 14","protocolId":"hbnc_day14","dueIn":0,"lastFlag":null,"steps":["weight","feeding","temp","cord","activity","counselling"]},
  {"id":"H-098","area":"Sector 3","protocol":"HBNC Day 7","protocolId":"hbnc_day7","dueIn":-1,"lastFlag":"feeding difficulty","steps":["weight","feeding","flag_feeding","temp","flag_temp","cord","flag_cord","activity","flag_activity","counselling"]},
  {"id":"H-155","area":"Sector 7","protocol":"HBNC Day 21","protocolId":"hbnc_day21","dueIn":0,"lastFlag":null,"steps":["weight","feeding","temp","cord","activity","counselling"]}
];

var PROTOCOL_URL = '/api/protocol/hbnc_day7';
var STORAGE_KEY = 'dastak_visit';
var CARRY_KEY = 'dastak_carry';

// --- State ---
var protocol = null;
var steps = {};
var currentStepId = null;
var history = [];
var answers = {};
var startedAt = null;
var completedAt = null;
var flags = [];
var state = 'idle';
var countValue = 0;
var householdIndex = 0;
var resumeStep = null;
var resumeTime = null;
var carryFlags = {};

// --- Load protocol (single XHR at startup only) ---
function loadProtocol() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', PROTOCOL_URL);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          protocol = JSON.parse(xhr.responseText);
          buildStepMap();
          loadCarryData();
          checkResume();
          computeIdle();
        } catch(e) {
          showError('Protocol parse error');
        }
      } else {
        showError('Protocol load failed');
      }
    }
  };
  xhr.send();
}

function buildStepMap() {
  steps = {};
  if (!protocol || !protocol.steps) return;
  for (var i = 0; i < protocol.steps.length; i++) {
    steps[protocol.steps[i].id] = protocol.steps[i];
  }
}

// ============================================================
// PROPERTY 1 — Anticipation: zero-query launch
// ============================================================
function computeIdle() {
  var household = ROSTER[householdIndex];
  document.getElementById('idle-household').textContent = household.id + ' · ' + household.area;
  document.getElementById('idle-protocol').textContent = household.protocol;

  var carryEl = document.getElementById('idle-carry');
  var prevFlags = getCarryFlags(household.id);
  if (prevFlags) {
    carryEl.textContent = '⟩ flagged last visit: ' + prevFlags;
    carryEl.style.color = '#00E5FF';
    carryEl.style.opacity = '0.7';
  } else {
    carryEl.textContent = '';
  }

  var triageEl = document.getElementById('idle-triage');
  triageEl.textContent = computeTriageNote();

  var resumeEl = document.getElementById('resume-indicator');
  if (resumeStep) {
    var elapsed = Date.now() - resumeTime;
    var mins = Math.floor(elapsed / 60000);
    resumeEl.textContent = 'Resuming ' + household.id + ', step ' + getStepIndex(resumeStep) + '. Interrupted ' + mins + 'm ago.';
    resumeEl.style.display = '';
  } else {
    resumeEl.style.display = 'none';
  }

  // FIX 1: Focus the begin button so Neural Band pinch works
  document.getElementById('idle-start').focus();
}

function getStepIndex(stepId) {
  if (!protocol || !protocol.steps) return '?';
  for (var i = 0; i < protocol.steps.length; i++) {
    if (protocol.steps[i].id === stepId) return (i + 1) + ' of ' + protocol.steps.length;
  }
  return '?';
}

// ============================================================
// PROPERTY 3 — Triage: the planner speaks once
// ============================================================
function computeTriageNote() {
  var overdue = 0;
  var flagged = 0;
  for (var i = 0; i < ROSTER.length; i++) {
    if (ROSTER[i].dueIn < 0) overdue++;
    if (ROSTER[i].lastFlag) flagged++;
  }
  if (overdue > 0) return 'Three overdue in Sector 3. Start there.';
  if (flagged > 0) return 'One flagged visit today. Start there.';
  return 'All visits on schedule.';
}

// ============================================================
// PROPERTY 4 — Carry-forward: verbatim recall
// ============================================================
function loadCarryData() {
  try {
    var raw = localStorage.getItem(CARRY_KEY);
    if (raw) carryFlags = JSON.parse(raw);
  } catch(e) {
    carryFlags = {};
  }
}

function getCarryFlags(householdId) {
  var record = carryFlags[householdId];
  if (!record || !record.flags || record.flags.length === 0) return null;
  var f = record.flags[0];
  return f.description || f.type;
}

function getCarryStepNote(householdId, stepId) {
  var record = carryFlags[householdId];
  if (!record || !record.flags) return null;
  for (var i = 0; i < record.flags.length; i++) {
    if (record.flags[i].stepId === stepId) {
      return 'flagged at the ' + record.flags[i].visitLabel + ' visit';
    }
  }
  return null;
}

function saveCarryData(householdId, visitFlags, visitLabel) {
  if (visitFlags.length === 0) return;
  carryFlags[householdId] = {
    flags: visitFlags.map(function(f) {
      return {
        stepId: f.stepId,
        type: f.type,
        description: f.description,
        visitLabel: visitLabel
      };
    })
  };
  try {
    localStorage.setItem(CARRY_KEY, JSON.stringify(carryFlags));
  } catch(e) {}
}

// ============================================================
// PROPERTY 2 — Continuity: resume mid-thought
// ============================================================
function checkResume() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (saved && saved.stepId && saved.householdId === ROSTER[householdIndex].id) {
      resumeStep = saved.stepId;
      resumeTime = saved.savedAt;
      answers = saved.answers || {};
      flags = saved.flags || [];
      history = saved.history || [];
    }
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      householdId: ROSTER[householdIndex].id,
      stepId: currentStepId,
      answers: answers,
      flags: flags,
      history: history,
      savedAt: Date.now()
    }));
  } catch(e) {}
}

function clearResume() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

// ============================================================
// UI helpers
// ============================================================
function show(id) {
  var els = ['idle-area','prompt-text','options','count-display','count-unit',
             'complete-area','carry-forward','resume-indicator'];
  for (var i = 0; i < els.length; i++) {
    var el = document.getElementById(els[i]);
    if (el) el.style.display = 'none';
  }
  var el = document.getElementById(id);
  if (el) el.style.display = '';
}

function showControls(type) {
  var ids = ['controls-idle','controls-step','enter-row-step',
             'controls-count','enter-row-count','controls-info',
             'controls-danger','controls-complete'];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).style.display = 'none';
  }
  if (type === 'idle') document.getElementById('controls-idle').style.display = '';
  if (type === 'step') {
    document.getElementById('controls-step').style.display = '';
    document.getElementById('enter-row-step').style.display = '';
  }
  if (type === 'count') {
    document.getElementById('controls-count').style.display = '';
    document.getElementById('enter-row-count').style.display = '';
  }
  if (type === 'info') document.getElementById('controls-info').style.display = '';
  if (type === 'danger') document.getElementById('controls-danger').style.display = '';
  if (type === 'complete') document.getElementById('controls-complete').style.display = '';
}

function updateProgress(current, total) {
  var pct = total > 0 ? (current / total) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updateStepInfo(current, total) {
  document.getElementById('step-info').textContent = 'step ' + current + ' of ' + total;
}

function showError(msg) {
  show('prompt-text');
  document.getElementById('prompt-text').textContent = msg;
  document.getElementById('prompt-text').style.color = '#E5484D';
  showControls('idle');
}

// ============================================================
// Render a step
// ============================================================
function renderStep(stepId) {
  var step = steps[stepId];
  if (!step) { renderComplete(); return; }

  currentStepId = stepId;
  state = 'step';

  var household = ROSTER[householdIndex];
  document.getElementById('protocol-label').textContent = household.protocol.toUpperCase();

  var stepIdx = getStepIndex(stepId);
  updateStepInfo(stepIdx.split(' of ')[0], stepIdx.split(' of ')[1]);
  updateProgress(history.length, protocol.steps.length);

  // Save progress for resume (Property 2)
  saveProgress();

  show('prompt-text');
  document.getElementById('prompt-text').style.color = '#fff';
  document.getElementById('prompt-text').textContent = step.prompt;

  // PROPERTY 4: carry-forward
  var cfEl = document.getElementById('carry-forward');
  var cfNote = getCarryStepNote(household.id, stepId);
  if (cfNote) {
    cfEl.textContent = '⟩ ' + cfNote;
    cfEl.style.display = '';
  } else {
    cfEl.style.display = 'none';
  }

  // Render step type
  if (step.type === 'yesno') {
    renderYesNo(step);
    showControls('step');
  } else if (step.type === 'count') {
    renderCount(step);
    state = 'count';
    showControls('count');
  } else if (step.type === 'choice') {
    renderChoice(step);
    showControls('step');
  } else if (step.type === 'info') {
    if (step.danger) {
      state = 'danger';
      document.getElementById('prompt-text').style.color = '#E5484D';
      showControls('danger');
    } else {
      state = 'info';
      showControls('info');
    }
  }
}

// ============================================================
// FIX 1: Render functions create real <button> elements
// Arrow keys call .focus() on elements, not update variables.
// ============================================================
function renderYesNo(step) {
  var container = document.getElementById('options');
  container.innerHTML = '';

  var noBtn = document.createElement('button');
  noBtn.className = 'option-btn';
  noBtn.setAttribute('data-val', 'no');
  noBtn.setAttribute('role', 'radio');
  noBtn.setAttribute('aria-checked', 'false');
  noBtn.setAttribute('aria-label', 'No');
  noBtn.textContent = 'NO';
  noBtn.addEventListener('click', function(e) {
    e.preventDefault();
    selectOption(this, 'no');
    advance();
  });

  var yesBtn = document.createElement('button');
  yesBtn.className = 'option-btn selected';
  yesBtn.setAttribute('data-val', 'yes');
  yesBtn.setAttribute('role', 'radio');
  yesBtn.setAttribute('aria-checked', 'true');
  yesBtn.setAttribute('aria-label', 'Yes');
  yesBtn.textContent = 'YES';
  yesBtn.addEventListener('click', function(e) {
    e.preventDefault();
    selectOption(this, 'yes');
    advance();
  });

  container.appendChild(noBtn);
  container.appendChild(yesBtn);
  container.style.display = '';

  // FIX 1: Focus the selected option
  yesBtn.focus();
}

function renderCount(step) {
  countValue = step.default || 2.8;
  document.getElementById('count-display').textContent = countValue.toFixed(1);
  document.getElementById('count-unit').textContent = step.unit || '';
  document.getElementById('count-display').style.display = '';
  document.getElementById('count-unit').style.display = '';

  // FIX 1: Render count controls as real buttons
  var container = document.getElementById('options');
  container.innerHTML = '';
  container.style.display = '';

  var decBtn = document.createElement('button');
  decBtn.className = 'count-btn';
  decBtn.setAttribute('aria-label', 'Decrease value');
  decBtn.textContent = '−';
  decBtn.addEventListener('click', function(e) {
    e.preventDefault();
    adjustCount(-1);
  });

  var incBtn = document.createElement('button');
  incBtn.className = 'count-btn';
  incBtn.setAttribute('aria-label', 'Increase value');
  incBtn.textContent = '+';
  incBtn.addEventListener('click', function(e) {
    e.preventDefault();
    adjustCount(1);
  });

  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'count-btn confirm';
  confirmBtn.setAttribute('aria-label', 'Confirm value');
  confirmBtn.textContent = '✓';
  confirmBtn.addEventListener('click', function(e) {
    e.preventDefault();
    advance();
  });

  container.appendChild(decBtn);
  container.appendChild(incBtn);
  container.appendChild(confirmBtn);

  // Focus the increment button by default
  incBtn.focus();
}

function renderChoice(step) {
  var container = document.getElementById('options');
  container.innerHTML = '';

  for (var i = 0; i < step.options.length; i++) {
    var btn = document.createElement('button');
    btn.className = 'option-btn' + (i === 0 ? ' selected' : '');
    btn.setAttribute('data-val', String(i));
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', step.options[i]);
    btn.textContent = step.options[i];
    btn.addEventListener('click', (function(idx) {
      return function(e) {
        e.preventDefault();
        selectChoiceOption(idx);
        advance();
      };
    })(i));
    container.appendChild(btn);
  }
  container.style.display = '';

  // FIX 1: Focus the first option
  container.querySelector('.option-btn').focus();
}

// ============================================================
// FIX 1: Focus helpers — arrow keys call .focus() on real elements
// ============================================================
function selectOption(btn, val) {
  var opts = document.querySelectorAll('#options .option-btn');
  for (var i = 0; i < opts.length; i++) {
    var isSelected = opts[i].getAttribute('data-val') === val;
    opts[i].classList.toggle('selected', isSelected);
    opts[i].setAttribute('aria-checked', isSelected ? 'true' : 'false');
  }
  btn.focus();
}

function selectChoiceOption(idx) {
  var opts = document.querySelectorAll('#options .option-btn');
  for (var i = 0; i < opts.length; i++) {
    var isSelected = i === idx;
    opts[i].classList.toggle('selected', isSelected);
    opts[i].setAttribute('aria-checked', isSelected ? 'true' : 'false');
  }
  if (opts[idx]) opts[idx].focus();
}

function adjustCount(dir) {
  var step = steps[currentStepId];
  if (!step) return;
  var delta = dir * (step.step || 0.1);
  countValue = Math.round((countValue + delta) * 10) / 10;
  countValue = Math.max(step.min || 0, Math.min(countValue, step.max || 10));
  document.getElementById('count-display').textContent = countValue.toFixed(1);

  // Focus the adjusted button
  var btns = document.querySelectorAll('#options .count-btn');
  if (dir < 0 && btns[0]) btns[0].focus();
  if (dir > 0 && btns[1]) btns[1].focus();
}

// ============================================================
// Navigation
// ============================================================
function getActiveAnswer() {
  var step = steps[currentStepId];
  if (!step) return null;

  if (step.type === 'yesno') {
    var active = document.querySelector('#options .option-btn.selected');
    return active ? active.getAttribute('data-val') : 'yes';
  } else if (step.type === 'count') {
    return countValue;
  } else if (step.type === 'choice') {
    var active = document.querySelector('#options .option-btn.selected');
    return active ? step.options[parseInt(active.getAttribute('data-val'))] : step.options[0];
  } else if (step.type === 'info') {
    return step.danger ? 'flagged' : 'noted';
  }
  return null;
}

function getNextStep(step, answer) {
  if (step.type === 'yesno') {
    return answer === 'yes' ? step.onYes : step.onNo;
  } else if (step.type === 'count' || step.type === 'choice') {
    return step.next;
  } else if (step.type === 'info') {
    return step.next;
  }
  return null;
}

function advance() {
  var step = steps[currentStepId];
  if (!step) return;

  // FIX 1: Read answer from DOM, not cached variable
  var answer = getActiveAnswer();
  var nextStep = getNextStep(step, answer);

  answers[currentStepId] = answer;
  history.push(currentStepId);

  // Track flags (for carry-forward)
  if (step.danger) {
    flags.push({
      stepId: currentStepId,
      type: step.id,
      description: step.prompt,
      referral: step.referral
    });
  }

  // Check if this step leads to a flag step
  if (nextStep && steps[nextStep] && steps[nextStep].danger) {
    flags.push({
      stepId: nextStep,
      type: steps[nextStep].id,
      description: steps[nextStep].prompt,
      referral: steps[nextStep].referral
    });
    renderStep(nextStep);
  } else if (nextStep) {
    renderStep(nextStep);
  } else {
    renderComplete();
  }
}

function goBack() {
  if (history.length < 2) return;
  history.pop();
  var prevStep = history.pop();
  renderStep(prevStep);
}

// ============================================================
// Completion
// ============================================================
function renderComplete() {
  state = 'complete';
  completedAt = new Date().toLocaleTimeString();
  var durationMs = Date.now() - startedAt;
  var totalSec = Math.floor(durationMs / 1000);
  var min = Math.floor(totalSec / 60);
  var sec = totalSec % 60;
  var durStr = min === 0 ? sec + 's' : min + 'm ' + sec + 's';

  show('complete-area');
  document.getElementById('done-stats').textContent =
    history.length + ' steps · ' + flags.length + ' flags · ' + durStr;

  var household = ROSTER[householdIndex];
  var visitLabel = household.protocol;
  saveCarryData(household.id, flags, visitLabel);

  var record = {
    householdId: household.id,
    area: household.area,
    protocol: household.protocol,
    answers: answers,
    flags: flags.map(function(f) { return { stepId: f.stepId, type: f.type, referral: f.referral }; }),
    stepCount: history.length,
    flagCount: flags.length,
    durationMs: durationMs,
    startedAt: new Date(startedAt).toISOString(),
    completedAt: completedAt
  };

  document.getElementById('done-sync').textContent = 'Open on phone to view record';

  try {
    localStorage.setItem('dastak_last_record', JSON.stringify(record));
  } catch(e) {}

  clearResume();
  showControls('complete');
  updateProgress(protocol.steps.length, protocol.steps.length);
  document.getElementById('step-info').textContent = '';
}

// ============================================================
// FIX 1: Key handling — Enter activates document.activeElement
// Arrow keys call .focus() on real elements
// ============================================================
document.addEventListener('keydown', function(e) {
  if (state === 'idle') {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.activeElement.click();
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      cycleHousehold(1);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      cycleHousehold(-1);
    }
  } else if (state === 'step') {
    var step = steps[currentStepId];
    if (!step) return;

    if (step.type === 'yesno') {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        var opts = document.querySelectorAll('#options .option-btn');
        var currentIdx = 0;
        for (var i = 0; i < opts.length; i++) {
          if (opts[i] === document.activeElement) { currentIdx = i; break; }
        }
        var nextIdx = e.key === 'ArrowRight' ? Math.min(currentIdx + 1, opts.length - 1) : Math.max(currentIdx - 1, 0);
        if (opts[nextIdx]) {
          selectOption(opts[nextIdx], opts[nextIdx].getAttribute('data-val'));
        }
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        document.activeElement.click();
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        goBack();
      }
    } else if (step.type === 'choice') {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        var opts = document.querySelectorAll('#options .option-btn');
        var currentIdx = 0;
        for (var i = 0; i < opts.length; i++) {
          if (opts[i] === document.activeElement) { currentIdx = i; break; }
        }
        var nextIdx = e.key === 'ArrowRight' ? Math.min(currentIdx + 1, opts.length - 1) : Math.max(currentIdx - 1, 0);
        selectChoiceOption(nextIdx);
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        document.activeElement.click();
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        goBack();
      }
    }
  } else if (state === 'count') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
      e.preventDefault();
      adjustCount(1);
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
      e.preventDefault();
      adjustCount(-1);
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      document.activeElement.click();
    }
  } else if (state === 'danger' || state === 'info') {
    if (e.key === 'Enter') {
      e.preventDefault();
      advance();
    }
  } else if (state === 'complete') {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      goBack();
    }
  }

  // FIX 4: Back gesture — Escape and Backspace map to native back.
  // Save progress so relaunch resumes with all answers intact.
  // Do NOT add synthetic history entries.
  if (e.key === 'Escape' || e.key === 'Backspace') {
    if (state !== 'idle') {
      // Ensure progress is saved before the shell exits
      if (currentStepId) saveProgress();
      // Do not prevent default — let the shell handle the back gesture
    }
  }
});

function cycleHousehold(dir) {
  householdIndex = (householdIndex + dir + ROSTER.length) % ROSTER.length;
  resumeStep = null;
  resumeTime = null;
  computeIdle();
}

function startVisit() {
  startedAt = Date.now();
  history = [];
  answers = {};
  flags = [];

  if (resumeStep) {
    renderStep(resumeStep);
  } else {
    if (protocol && protocol.start) {
      renderStep(protocol.start);
    } else if (protocol && protocol.steps && protocol.steps.length > 0) {
      renderStep(protocol.steps[0].id);
    }
  }
}

// ============================================================
// Begin button click handler
// ============================================================
document.getElementById('idle-start').addEventListener('click', function(e) {
  e.preventDefault();
  startVisit();
});

// ============================================================
// Init (Property 6: zero friction)
// ============================================================
var loadStart = Date.now();
loadProtocol();
setTimeout(function() {
  var elapsed = Date.now() - loadStart;
  if (elapsed > 3000) {
    document.getElementById('offline-marker').textContent = 'loaded in ' + elapsed + 'ms';
    document.getElementById('offline-marker').style.display = '';
  }
}, 3500);

// ============================================================
// FIX 5: Service worker registration
// ============================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function() {});
}

// ============================================================
// FIX 5: Navigator.onLine indicator
// Wired to online/offline events, feeds the existing confidence line.
// ============================================================
var offlineMarker = document.getElementById('offline-marker');
function updateOnlineStatus() {
  if (!navigator.onLine) {
    offlineMarker.textContent = 'offline — saved locally';
    offlineMarker.style.display = '';
  } else {
    // Only show if there was a load time warning
    if (offlineMarker.textContent.indexOf('loaded in') === -1) {
      offlineMarker.style.display = 'none';
    }
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
if (!navigator.onLine) updateOnlineStatus();
</script>
