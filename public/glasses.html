<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#000000">
<meta name="description" content="Dastak — one-question-at-a-time field visit workflow for a 600×600 head-worn display. Prototype; not clinically validated.">
<link rel="icon" type="image/png" href="/icon-96.png" sizes="96x96">
<title>Dastak</title>
<style>
:root{--bg:#000;--fg:#fff;--muted:#A3ACB6;--line:#3A424B;--accent:#00E5FF;--danger:#FF6B70;--warn:#FFC24B;--font:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:600px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
#app{width:600px;height:600px;display:flex;flex-direction:column}
#ctx{flex:0 0 auto;padding:12px 24px 0}
#ctx .row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-height:26px}
#ctx-label{font-size:20px;letter-spacing:1px;text-transform:uppercase;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx-progress{font-size:18px;color:var(--muted);white-space:nowrap}
#ctx-meta{font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx-save{font-size:18px;color:var(--muted);white-space:nowrap}
#ctx-save.bad{color:var(--warn);font-weight:700}
#bar{height:3px;background:#1d2228;margin-top:8px}
#bar-fill{height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
#main{flex:1 1 auto;padding:16px 24px 0;display:flex;flex-direction:column;min-height:0}
#keys{flex:0 0 auto;height:52px;padding:0 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:18px;color:var(--muted)}
#keys b{color:var(--accent);font-weight:400}
.kicker{font-size:18px;letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.kicker.danger{color:var(--danger)}
.kicker.warn{color:var(--warn)}
.prompt{font-size:34px;line-height:1.25;margin:8px 0 12px}
.prompt.danger{color:var(--danger)}
.sub{font-size:20px;line-height:1.35;color:var(--muted);margin-bottom:8px}
.sub.fg{color:var(--fg)}
.note{font-size:18px;color:var(--accent);margin-bottom:8px}
.notice{font-size:18px;color:var(--warn);margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:auto;margin-bottom:16px}
.list.row{flex-direction:row}
.list.row .opt{flex:1}
.opt{font:inherit;font-size:26px;min-height:60px;padding:8px 18px;background:var(--bg);color:var(--muted);border:2px solid var(--line);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.list.row .opt{justify-content:center;min-height:88px;font-size:30px}
.opt .tag{font-size:18px;color:var(--muted)}
.opt[aria-checked="true"],.opt[aria-selected="true"]{color:var(--fg);border-color:var(--accent);outline:3px solid var(--accent);outline-offset:2px}
.opt.compact{min-height:52px;font-size:22px}
.opt:focus{outline:3px solid var(--accent);outline-offset:2px}
.edge{font-size:18px;color:var(--muted);text-align:center;height:22px}
.count{font-size:84px;text-align:center;margin-top:8px}
.count-unit{font-size:22px;color:var(--muted);text-align:center}
.count-hint{font-size:18px;color:var(--muted);text-align:center;margin-top:8px}
.flags{list-style:none;margin:8px 0}
.flags li{font-size:20px;color:var(--danger);margin-bottom:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
</style>
</head>
<body>
<div id="app" role="application" aria-roledescription="head-worn visit workflow" aria-label="Dastak">
  <header id="ctx">
    <div class="row"><span id="ctx-label">DASTAK</span><span id="ctx-progress"></span></div>
    <div class="row"><span id="ctx-meta"></span><span id="ctx-save" role="status"></span></div>
    <div id="bar" aria-hidden="true"><div id="bar-fill"></div></div>
  </header>
  <main id="main" aria-live="polite">
    <p class="kicker">Loading</p>
    <p class="sub" id="boot-message">If this message stays, the app's scripts did not load. Reload once while online so they can be stored on this device.</p>
  </main>
  <footer id="keys" aria-hidden="true"></footer>
</div>
<script src="/js/engine.js"></script>
<script src="/js/store.js"></script>
<script src="/generated/registry.js"></script>
<script src="/js/glasses-app.js"></script>
</body>
</html>
