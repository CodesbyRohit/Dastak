<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Multi-protocol health visit companion for field health workers">
<link rel="icon" type="image/png" href="/icon-96.png" sizes="96x96">
<title>Dastak</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font-family:ui-monospace,"SF Mono",Menlo,monospace;-webkit-font-smoothing:antialiased}
#app{width:600px;height:600px;display:flex;flex-direction:column;position:relative}
#context{height:72px;padding:0 24px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid #8B949E;flex-shrink:0}
#context .label{font-size:18px;color:#8B949E;letter-spacing:1px;text-transform:uppercase}
#context .step-info{font-size:18px;color:#8B949E;text-align:right}
#context .header-row{display:flex;justify-content:space-between;align-items:center}
#progress-track{width:100%;height:2px;background:#1a1a1a;margin-top:8px;flex-shrink:0}
#progress-fill{height:100%;background:#00E5FF;width:100%;transform:scaleX(0);transform-origin:left;transition:transform 0.33s steps(10);will-change:transform}
#question-area{flex:1;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center}
#prompt-text{font-size:36px;text-align:center;line-height:1.3;color:#fff;max-width:540px}
#options{padding:0 24px 24px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.focusable{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:28px;min-height:88px;padding:12px 20px;border:2px solid transparent;color:#8B949E;background:#000;cursor:pointer;text-align:center;user-select:none;outline:none;transition:border-color 33ms step-end,color 33ms step-end,opacity 33ms step-end}
.focusable:focus{outline:2px solid rgba(0,212,255,0.4);outline-offset:4px;border-color:#00d4ff;color:#fff}
.focusable:active{opacity:0.7}
.focusable.selected{color:#fff;border-color:#8B949E}
#count-display{font-size:72px;color:#fff;text-align:center;margin:16px 0}
#count-unit{font-size:18px;color:#8B949E;text-align:center}
#complete-area{padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px}
#complete-area .done-label{font-size:18px;color:#00E5FF;letter-spacing:1px;text-transform:uppercase}
#complete-area .done-text{font-size:28px;color:#fff}
#complete-area .done-stats{font-size:18px;color:#8B949E;margin-top:8px}
#complete-area .done-sync{font-size:18px;color:#8B949E;margin-top:16px}
#controls{height:192px;padding:24px;display:flex;flex-direction:column;justify-content:flex-end;border-top:1px solid #8B949E;flex-shrink:0}
#controls .control-row{display:flex;justify-content:space-between;font-size:18px;color:#8B949E}
#controls .key{color:#00E5FF}
#controls .action{color:#8B949E}
#controls .enter-row{margin-top:8px}
#offline-marker{position:absolute;top:8px;right:24px;font-size:18px;color:#8B949E;display:none}
#carry-forward{font-size:18px;color:#00E5FF;margin-top:12px;opacity:0.7}
#launch-area{padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:24px}
#launch-area .launch-title{font-size:24px;color:#8B949E;letter-spacing:1px;text-transform:uppercase}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>
<div id="app" role="main" aria-label="Dastak multi-protocol health visit application">
  <div id="context" role="banner">
    <div class="header-row">
      <span id="protocol-label" class="label">DASTAK</span>
      <span id="step-info" class="step-info"></span>
    </div>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
  <div id="question-area">
    <div id="launch-area">
      <div class="launch-title">What is this visit?</div>
      <div id="launch-options" style="width:100%"></div>
    </div>
    <div id="prompt-text" role="heading" aria-level="2" style="display:none"></div>
    <div id="carry-forward" style="display:none"></div>
    <div id="options" style="display:none"></div>
    <div id="count-display" style="display:none"></div>
    <div id="count-unit" style="display:none"></div>
    <div id="complete-area" style="display:none">
      <div class="done-label">COMPLETE</div>
      <div class="done-text">Visit recorded.</div>
      <div id="done-stats" class="done-stats"></div>
      <div id="done-sync" class="done-sync"></div>
    </div>
  </div>
  <div id="controls">
    <div id="controls-launch" class="control-row">
      <span><span class="key">← →</span> <span class="action">choose protocol</span></span>
    </div>
    <div class="enter-row" id="enter-row-launch">
      <span><span class="key">ENTER</span> <span class="action">begin</span></span>
    </div>
    <div id="controls-step" class="control-row" style="display:none">
      <span><span class="key">← →</span> <span class="action">choose</span></span>
      <span><span class="key">↑ back</span></span>
    </div>
    <div class="enter-row" id="enter-row-step" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">confirm</span></span>
    </div>
    <div id="controls-count" class="control-row" style="display:none">
      <span><span class="key">↑ ↓</span> <span class="action">adjust</span></span>
    </div>
    <div class="enter-row" id="enter-row-count" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">confirm</span></span>
    </div>
    <div id="controls-info" class="control-row" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">continue</span></span>
    </div>
    <div id="controls-danger" class="control-row" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">continue</span></span>
    </div>
    <div id="controls-complete" class="control-row" style="display:none">
      <span><span class="key">ENTER</span> <span class="action">back to launcher</span></span>
    </div>
  </div>
  <div id="audio-indicator" style="display:none;align-items:center;justify-content:center;gap:4px;position:absolute;bottom:200px;left:50%;transform:translateX(-50%);z-index:10;height:24px"><span class="bar" style="width:4px;height:12px;background:#00E5FF;border-radius:2px"></span><span class="bar" style="width:4px;height:12px;background:#00E5FF;border-radius:2px"></span><span class="bar" style="width:4px;height:12px;background:#00E5FF;border-radius:2px"></span><span class="bar" style="width:4px;height:12px;background:#00E5FF;border-radius:2px"></span><span class="bar" style="width:4px;height:12px;background:#00E5FF;border-radius:2px"></span></div>
  <div id="offline-marker">saved locally</div>
</div>
<script>
// ============================================================
// DASTAK — Multi-Protocol Engine
// NO fetch. NO XMLHttpRequest. NO navigator.sendBeacon.
// All protocols loaded from embedded registry. Zero network calls.
// ============================================================

var DPAD = {
  UP: 'ArrowUp', DOWN: 'ArrowDown',
  LEFT: 'ArrowLeft', RIGHT: 'ArrowRight',
  SELECT: 'Enter', BACK: 'Escape'
};

// ============================================================
// PROTOCOL REGISTRY — all protocols embedded for offline-first
// Canonical source: protocols/*.json (see verify.js)
// ============================================================
var PROTOCOLS = [

      {"id":"cord","prompt":"Is the cord stump clean and dry?","type":"yesno","onYes":"activity","onNo":"flag_cord","content_source":"UNSOURCED"},
      {"id":"flag_cord","prompt":"Cord problem recorded","type":"info","danger":true,"referral":"Refer to the health facility.","next":"activity","content_source":"UNSOURCED"},
      {"id":"activity","prompt":"Is the baby active when awake?","type":"yesno","onYes":"counselling","onNo":"flag_activity","content_source":"UNSOURCED"},
      {"id":"flag_activity","prompt":"Reduced activity recorded","type":"info","danger":true,"referral":"Refer to the health facility.","next":"counselling","content_source":"UNSOURCED"},
      {"id":"counselling","prompt":"Topics covered with the mother","type":"choice","options":["Feeding","Warmth","Hygiene","All three"],"next":null,"content_source":"UNSOURCED"}
    ]
  },
  {
    "id": "danger_signs",
    "label": "Danger Signs",
    "start": "fever",
    "status": "demo-ready",
    "version": "1.0.0",
    "steps": [
      {"id":"fever","prompt":"Does the beneficiary report fever?","type":"yesno","onYes":"temp","onNo":"headache","content_source":"UNSOURCED"},
      {"id":"temp","prompt":"Record the beneficiary's temperature","type":"range","min":35.0,"max":42.0,"step":0.5,"unit":"°C","default":36.5,"next":"headache","rule":{"condition":{"op":"gt","value":38.5},"target":"referral"},"content_source":"UNSOURCED"},
      {"id":"headache","prompt":"Does the beneficiary report severe headache?","type":"yesno","onYes":"stiff_neck","onNo":"rash","content_source":"UNSOURCED"},
      {"id":"stiff_neck","prompt":"Does the beneficiary report stiff neck?","type":"yesno","onYes":"referral","onNo":"rash","content_source":"UNSOURCED"},
      {"id":"rash","prompt":"Does the beneficiary report rash?","type":"yesno","onYes":"referral","onNo":"breathing","content_source":"UNSOURCED"},
      {"id":"breathing","prompt":"Is the beneficiary breathing with difficulty?","type":"yesno","onYes":"referral","onNo":"complete","content_source":"UNSOURCED"},
      {"id":"complete","prompt":"Danger signs assessed. No immediate referral needed.","type":"info","next":null,"content_source":"UNSOURCED"},
      {"id":"referral","prompt":"Refer to the health facility.","type":"info","danger":true,"referral":"This check-in does not replace clinical judgement.","next":null,"content_source":"UNSOURCED"}
    ]
  },
  {
    "id": "adherence",
    "label": "Treatment Follow-Up",
    "start": "doses",
    "status": "demo-ready",
    "version": "1.0.0",
    "steps": [
      {"id":"doses","prompt":"Doses taken since last visit?","type":"choice","options":[{"label":"All doses taken","value":"all","next":"regimen"},{"label":"Missed 1–2 doses","value":"missed_few","next":"flag_adherence"},{"label":"Missed 3+ doses","value":"missed_many","next":"flag_adherence"}],"content_source":"UNSOURCED"},
      {"id":"flag_adherence","prompt":"Dose-miss pattern recorded","type":"info","danger":true,"referral":"Review adherence barriers with the beneficiary.","next":"regimen","content_source":"UNSOURCED"},
      {"id":"regimen","prompt":"Current medication phase?","type":"choice","options":["Intensive phase","Continuation phase","Not sure"],"next":"side_effects","content_source":"UNSOURCED"},
      {"id":"side_effects","prompt":"Any reported side effects?","type":"yesno","onYes":"side_effect_detail","onNo":"weight","content_source":"UNSOURCED"},
      {"id":"side_effect_detail","prompt":"Which side effects reported?","type":"choice","options":["Nausea or vomiting","Joint pain","Vision changes","Skin rash"],"next":"flag_side_effects","content_source":"UNSOURCED"},
      {"id":"flag_side_effects","prompt":"Side effects recorded","type":"info","danger":true,"referral":"Report side effects to the supervisor.","next":"weight","content_source":"UNSOURCED"},
      {"id":"weight","prompt":"Record the beneficiary's weight","type":"count","unit":"kg","min":30.0,"max":120.0,"step":0.5,"default":55.0,"next":"counselling","content_source":"UNSOURCED"},
      {"id":"counselling","prompt":"Counselling topics covered","type":"choice","options":["Completion importance","Side effects awareness","Nutrition support","All three"],"next":null,"content_source":"UNSOURCED"}
    ]
  },
  {
    "id": "post_discharge",
    "label": "Post-Discharge",
    "start": "overall",
    "status": "demo-ready",
    "version": "1.0.0",
    "steps": [
      {"id":"overall","prompt":"How is the beneficiary feeling since discharge?","type":"choice","options":[{"label":"Well","value":"well","next":"temp"},{"label":"Some complaints","value":"complaints","next":"symptom_category"},{"label":"Concerns","value":"concerns","next":"referral"}],"content_source":"UNSOURCED"},
      {"id":"symptom_category","prompt":"Primary concern?","type":"choice","options":[{"label":"Pain","value":"pain","next":"pain_detail"},{"label":"Bleeding","value":"bleeding","next":"bleeding_detail"},{"label":"Fever","value":"fever","next":"fever_temp"},{"label":"Wound problem","value":"wound","next":"wound_detail"}],"content_source":"UNSOURCED"},
      {"id":"pain_detail","prompt":"Where is the pain?","type":"choice","options":["Abdominal","Head","Chest","Back"],"next":"temp","content_source":"UNSOURCED"},
      {"id":"bleeding_detail","prompt":"Severity of bleeding?","type":"choice","options":[{"label":"Light spotting","value":"light","next":"temp"},{"label":"Moderate","value":"moderate","next":"temp"},{"label":"Heavy","value":"heavy","next":"referral"}],"content_source":"UNSOURCED"},
      {"id":"fever_temp","prompt":"Record the beneficiary's temperature","type":"range","min":35.0,"max":42.0,"step":0.5,"unit":"°C","default":36.5,"next":"temp","rule":{"condition":{"op":"gt","value":38.5},"target":"referral"},"content_source":"UNSOURCED"},
      {"id":"wound_detail","prompt":"Wound condition?","type":"choice","options":[{"label":"Clean and dry","value":"clean","next":"temp"},{"label":"Redness","value":"redness","next":"referral"},{"label":"Discharge","value":"discharge","next":"referral"},{"label":"Opening","value":"opening","next":"referral"}],"content_source":"UNSOURCED"},
      {"id":"temp","prompt":"Record the beneficiary's temperature","type":"range","min":35.0,"max":42.0,"step":0.5,"unit":"°C","default":36.5,"next":"bp","rule":{"condition":{"op":"gt","value":38.5},"target":"referral"},"content_source":"UNSOURCED"},
      {"id":"bp","prompt":"Record systolic blood pressure","type":"range","min":80,"max":200,"step":5,"unit":"mmHg","default":120,"next":"plan","rule":{"condition":{"op":"gt","value":140},"target":"flag_bp"},"content_source":"UNSOURCED"},
      {"id":"flag_bp","prompt":"Elevated blood pressure recorded","type":"info","danger":true,"referral":"Monitor blood pressure closely.","next":"plan","content_source":"UNSOURCED"},
      {"id":"plan","prompt":"Follow-up plan discussed","type":"choice","options":["Return in 1 week","Return in 2 weeks","Next scheduled visit"],"next":null,"content_source":"UNSOURCED"},
      {"id":"referral","prompt":"Refer to the health facility.","type":"info","danger":true,"referral":"This check-in does not replace clinical judgement.","next":null,"content_source":"UNSOURCED"}
    ]
  }
];

var STORAGE_KEY = 'dastak_visit';
var CARRY_KEY = 'dastak_carry';

// ============================================================
// ENGINE STATE
// ============================================================
var activeProtocol = null;
var steps = {};
var currentStepId = null;
var stepHistory = [];
var answers = {};
var startedAt = null;
var completedAt = null;
var flags = [];
var state = 'launch'; // launch | step | count | info | danger | complete
var countValue = 0;
var resumeStep = null;
var resumeTime = null;
var carryFlags = {};
var navigatingViaPopstate = false;
var launchIndex = 0;

// ============================================================
// FOCUS MANAGEMENT
// ============================================================
function getFocusables() {
  return Array.from(
    document.querySelectorAll('.focusable:not([disabled]):not(.hidden)')
  ).filter(function(el) {
    return el.offsetParent !== null;
  });
}

function moveFocus(direction) {
  var focusables = getFocusables();
  if (!focusables.length) return;
  var idx = focusables.indexOf(document.activeElement);
  if (idx === -1) { focusables[0].focus(); return; }
  var next;
  if (direction === 'up' || direction === 'left') {
    next = idx > 0 ? idx - 1 : focusables.length - 1;
  } else {
    next = idx < focusables.length - 1 ? idx + 1 : 0;
  }
  focusables[next].focus();
  focusables[next].scrollIntoView({ block: 'nearest', behavior: 'instant' });
}

// ============================================================
// PROTOCOL ENGINE — pure interpreter, no clinical logic
// ============================================================
function loadProtocolById(id) {
  for (var i = 0; i < PROTOCOLS.length; i++) {
    if (PROTOCOLS[i].id === id) return PROTOCOLS[i];
  }
  return null;
}

function buildStepMap() {
  steps = {};
  if (!activeProtocol || !activeProtocol.steps) return;
  for (var i = 0; i < activeProtocol.steps.length; i++) {
    steps[activeProtocol.steps[i].id] = activeProtocol.steps[i];
  }
}

function generateRangeChoices(step) {
  var choices = [];
  var v = step.min;
  while (v <= step.max + 0.0001) {
    var label = v % 1 === 0 ? String(v) : v.toFixed(1);
    if (step.unit) label += ' ' + step.unit;
    choices.push({ label: label, value: Math.round(v * 100) / 100 });
    v = Math.round((v + step.step) * 100) / 100;
  }
  return choices;
}

function evaluateRule(step, answer) {
  if (!step.rule) return false;
  var cond = step.rule.condition;
  var val = answer;
  // For range, answer is numeric
  if (typeof val === 'string' && !isNaN(Number(val))) val = Number(val);
  switch (cond.op) {
    case 'eq': return val === cond.value;
    case 'neq': return val !== cond.value;
    case 'gt': return val > cond.value;
    case 'gte': return val >= cond.value;
    case 'lt': return val < cond.value;
    case 'lte': return val <= cond.value;
    case 'in': return Array.isArray(cond.value) && cond.value.indexOf(val) !== -1;
    default: return false;
  }
}

function getActiveAnswer() {
  var step = steps[currentStepId];
  if (!step) return null;
  if (step.type === 'yesno') {
    var active = document.querySelector('#options .focusable.selected');
    return active ? active.getAttribute('data-val') : 'yes';
  } else if (step.type === 'count') {
    return countValue;
  } else if (step.type === 'choice') {
    var active = document.querySelector('#options .focusable.selected');
    if (!active) return null;
    var idx = parseInt(active.getAttribute('data-idx'), 10);
    if (step.options && typeof step.options[0] === 'object') {
      return step.options[idx] ? step.options[idx].value : null;
    }
    return active.getAttribute('data-val');
  } else if (step.type === 'range') {
    var active = document.querySelector('#options .focusable.selected');
    if (!active) return null;
    var val = active.getAttribute('data-val');
    return isNaN(Number(val)) ? val : Number(val);
  } else if (step.type === 'info') {
    return step.danger ? 'flagged' : 'noted';
  }
  return null;
}

function getNextStep(step, answer) {
  // Check escalation rule first
  if (step.rule && evaluateRule(step, answer)) {
    return step.rule.target;
  }
  if (step.type === 'yesno') {
    return answer === 'yes' ? step.onYes : step.onNo;
  } else if (step.type === 'choice') {
    // Check per-option branching
    if (step.options && typeof step.options[0] === 'object') {
      for (var i = 0; i < step.options.length; i++) {
        if (step.options[i].value === answer || step.options[i].label === answer) {
          if (step.options[i].next !== undefined) return step.options[i].next;
        }
      }
    }
    return step.next;
  } else if (step.type === 'range' || step.type === 'count') {
    return step.next;
  } else if (step.type === 'info') {
    return step.next;
  }
  return null;
}

function getEffectiveTotalSteps() {
  if (!activeProtocol || !activeProtocol.steps) return 1;
  return activeProtocol.steps.length;
}

function getStepDisplayIndex(stepId) {
  if (!activeProtocol || !activeProtocol.steps) return '?';
  for (var i = 0; i < activeProtocol.steps.length; i++) {
    if (activeProtocol.steps[i].id === stepId) return (i + 1) + ' of ' + activeProtocol.steps.length;
  }
  return '?';
}

// ============================================================
// LAUNCHER — one-decision-per-frame protocol selection
// ============================================================
function renderLauncher() {
  state = 'launch';
  activeProtocol = null;
  steps = {};
  currentStepId = null;

  document.getElementById('protocol-label').textContent = 'DASTAK';
  document.getElementById('step-info').textContent = '';
  updateProgress(0, 1);

  show('launch-area');
  var container = document.getElementById('launch-options');
  container.innerHTML = '';

  for (var i = 0; i < PROTOCOLS.length; i++) {
    var btn = document.createElement('button');
    btn.className = 'focusable' + (i === launchIndex ? ' selected' : '');
    btn.setAttribute('data-idx', String(i));
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', i === launchIndex ? 'true' : 'false');
    btn.setAttribute('aria-label', PROTOCOLS[i].label);
    btn.textContent = PROTOCOLS[i].label.toUpperCase();
    btn.addEventListener('click', (function(idx) {
      return function(e) {
        e.preventDefault();
        launchIndex = idx;
        selectLaunchOption(idx);
        startProtocol();
      };
    })(i));
    container.appendChild(btn);
  }
  container.style.display = '';

  showControls('launch');
  var btns = container.querySelectorAll('.focusable');
  if (btns[launchIndex]) btns[launchIndex].focus();
}

function selectLaunchOption(idx) {
  var opts = document.querySelectorAll('#launch-options .focusable');
  for (var i = 0; i < opts.length; i++) {
    var isSelected = i === idx;
    opts[i].classList.toggle('selected', isSelected);
    opts[i].setAttribute('aria-checked', isSelected ? 'true' : 'false');
  }
}

function startProtocol() {
  var proto = PROTOCOLS[launchIndex];
  if (!proto) return;
  activeProtocol = proto;
  buildStepMap();
  loadCarryData();
  checkResume();
  startedAt = Date.now();
  stepHistory = [];
  answers = {};
  flags = [];
  ensureAudio();
  if (resumeStep) {
    renderStep(resumeStep);
  } else if (activeProtocol.start) {
    renderStep(activeProtocol.start);
  } else if (activeProtocol.steps && activeProtocol.steps.length > 0) {
    renderStep(activeProtocol.steps[0].id);
  }
}

// ============================================================
// CARRY-FORWARD
// ============================================================
function loadCarryData() {
  try {
    var raw = localStorage.getItem(CARRY_KEY);
    if (raw) carryFlags = JSON.parse(raw);
  } catch(e) { carryFlags = {}; }
}

function getCarryStepNote(stepId) {
  // Use a generic key based on protocol id + step id
  if (!activeProtocol) return null;
  var key = activeProtocol.id + ':' + stepId;
  var record = carryFlags[key];
  if (!record) return null;
  return '⟩ flagged at the ' + record.visitLabel + ' visit';
}

function saveCarryData(visitFlags, visitLabel) {
  if (visitFlags.length === 0 || !activeProtocol) return;
  for (var i = 0; i < visitFlags.length; i++) {
    var key = activeProtocol.id + ':' + visitFlags[i].stepId;
    carryFlags[key] = {
      stepId: visitFlags[i].stepId,
      type: visitFlags[i].type,
      description: visitFlags[i].description,
      visitLabel: visitLabel
    };
  }
  try { localStorage.setItem(CARRY_KEY, JSON.stringify(carryFlags)); } catch(e) {}
}

// ============================================================
// RESUME
// ============================================================
function checkResume() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (saved && saved.stepId && saved.protocolId === (activeProtocol && activeProtocol.id)) {
      resumeStep = saved.stepId;
      resumeTime = saved.savedAt;
      answers = saved.answers || {};
      flags = saved.flags || [];
      stepHistory = saved.history || [];
    }
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      protocolId: activeProtocol ? activeProtocol.id : null,
      stepId: currentStepId,
      answers: answers,
      flags: flags,
      history: stepHistory,
      savedAt: Date.now()
    }));
  } catch(e) {}
}

function clearResume() {
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
}

// ============================================================
// UI HELPERS
// ============================================================
function show(id) {
  var els = ['launch-area','prompt-text','options','count-display','count-unit','complete-area','carry-forward'];
  for (var i = 0; i < els.length; i++) {
    var el = document.getElementById(els[i]);
    if (el) el.style.display = 'none';
  }
  var el = document.getElementById(id);
  if (el) el.style.display = '';
}

function showControls(type) {
  var ids = ['controls-launch','enter-row-launch','controls-step','enter-row-step',
             'controls-count','enter-row-count','controls-info','controls-danger','controls-complete'];
  for (var i = 0; i < ids.length; i++) {
    document.getElementById(ids[i]).style.display = 'none';
  }
  if (type === 'launch') {
    document.getElementById('controls-launch').style.display = '';
    document.getElementById('enter-row-launch').style.display = '';
  }
  if (type === 'step') {
    document.getElementById('controls-step').style.display = '';
    document.getElementById('enter-row-step').style.display = '';
  }
  if (type === 'count') {
    document.getElementById('controls-count').style.display = '';
    document.getElementById('enter-row-count').style.display = '';
  }
  if (type === 'info') document.getElementById('controls-info').style.display = '';
  if (type === 'danger') document.getElementById('controls-danger').style.display = '';
  if (type === 'complete') document.getElementById('controls-complete').style.display = '';
}

function updateProgress(current, total) {
  var pct = total > 0 ? (current / total) : 0;
  document.getElementById('progress-fill').style.transform = 'scaleX(' + pct + ')';
}

function updateStepInfo(current, total) {
  document.getElementById('step-info').textContent = 'step ' + current + ' of ' + total;
}

// ============================================================
// RENDER A STEP — one frame per step, always
// ============================================================
function renderStep(stepId) {
  var step = steps[stepId];
  if (!step) { renderComplete(); return; }

  currentStepId = stepId;
  state = 'step';

  document.getElementById('protocol-label').textContent = activeProtocol.label.toUpperCase();
  var stepIdx = getStepDisplayIndex(stepId);
  updateStepInfo(stepIdx.split(' of ')[0], stepIdx.split(' of ')[1]);
  updateProgress(stepHistory.length, getEffectiveTotalSteps());
  saveProgress();

  show('prompt-text');
  document.getElementById('prompt-text').style.color = '#fff';
  document.getElementById('prompt-text').textContent = step.prompt;

  // Carry-forward
  var cfEl = document.getElementById('carry-forward');
  var cfNote = getCarryStepNote(stepId);
  if (cfNote) {
    cfEl.textContent = cfNote;
    cfEl.style.display = '';
    playCarryTone();
  } else {
    cfEl.style.display = 'none';
  }

  if (step.type === 'yesno') {
    renderYesNo(step);
    showControls('step');
  } else if (step.type === 'count') {
    renderCount(step);
    state = 'count';
    showControls('count');
  } else if (step.type === 'choice') {
    renderChoice(step);
    showControls('step');
  } else if (step.type === 'range') {
    renderRange(step);
    showControls('step');
  } else if (step.type === 'info') {
    if (step.danger) {
      state = 'danger';
      document.getElementById('prompt-text').style.color = '#E5484D';
      showControls('danger');
      playReferralTone();
    } else {
      state = 'info';
      showControls('info');
    }
  }

  if (!navigatingViaPopstate) {
    window.history.pushState({screen:'step', stepId: stepId}, '', '#step/' + stepId);
  }
}

function renderYesNo(step) {
  var container = document.getElementById('options');
  container.innerHTML = '';
  var noBtn = document.createElement('button');
  noBtn.className = 'focusable';
  noBtn.setAttribute('data-val', 'no');
  noBtn.setAttribute('role', 'radio');
  noBtn.setAttribute('aria-checked', 'false');
  noBtn.setAttribute('aria-label', 'No');
  noBtn.textContent = 'NO';
  noBtn.addEventListener('click', function(e) { e.preventDefault(); selectOption(this, 'no'); advance(); });

  var yesBtn = document.createElement('button');
  yesBtn.className = 'focusable selected';
  yesBtn.setAttribute('data-val', 'yes');
  yesBtn.setAttribute('role', 'radio');
  yesBtn.setAttribute('aria-checked', 'true');
  yesBtn.setAttribute('aria-label', 'Yes');
  yesBtn.textContent = 'YES';
  yesBtn.addEventListener('click', function(e) { e.preventDefault(); selectOption(this, 'yes'); advance(); });

  container.appendChild(noBtn);
  container.appendChild(yesBtn);
  container.style.display = '';
  yesBtn.focus();
}

function renderCount(step) {
  countValue = step.default || 2.8;
  document.getElementById('count-display').textContent = countValue.toFixed(1);
  document.getElementById('count-unit').textContent = step.unit || '';
  document.getElementById('count-display').style.display = '';
  document.getElementById('count-unit').style.display = '';

  var container = document.getElementById('options');
  container.innerHTML = '';
  container.style.display = '';

  var decBtn = document.createElement('button');
  decBtn.className = 'focusable';
  decBtn.setAttribute('aria-label', 'Decrease value');
  decBtn.textContent = '−';
  decBtn.addEventListener('click', function(e) { e.preventDefault(); adjustCount(-1); });

  var incBtn = document.createElement('button');
  incBtn.className = 'focusable';
  incBtn.setAttribute('aria-label', 'Increase value');
  incBtn.textContent = '+';
  incBtn.addEventListener('click', function(e) { e.preventDefault(); adjustCount(1); });

  var confirmBtn = document.createElement('button');
  confirmBtn.className = 'focusable';
  confirmBtn.setAttribute('aria-label', 'Confirm value');
  confirmBtn.textContent = '✓';
  confirmBtn.addEventListener('click', function(e) { e.preventDefault(); advance(); });

  container.appendChild(decBtn);
  container.appendChild(incBtn);
  container.appendChild(confirmBtn);
  incBtn.focus();
}

function renderChoice(step) {
  var container = document.getElementById('options');
  container.innerHTML = '';
  for (var i = 0; i < step.options.length; i++) {
    var btn = document.createElement('button');
    btn.className = 'focusable' + (i === 0 ? ' selected' : '');
    btn.setAttribute('data-idx', String(i));
    var label = typeof step.options[i] === 'object' ? step.options[i].label : step.options[i];
    var val = typeof step.options[i] === 'object' ? step.options[i].value : step.options[i];
    btn.setAttribute('data-val', String(val));
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-checked', i === 0 ? 'true' : 'false');
    btn.setAttribute('aria-label', label);
    btn.textContent = label;
    btn.addEventListener('click', (function(idx) {
      return function(e) {
        e.preventDefault();
        selectChoiceOption(idx);
        advance();
      };
    })(i));
    container.appendChild(btn);
  }
  container.style.display = '';
  container.querySelector('.focusable').focus();
}

function renderRange(step) {
  // Range generates a choice list from min/max/step
  var choices = generateRangeChoices(step);
  // Temporarily create a synthetic choice step
  var syntheticStep = {
    id: step.id,
    prompt: step.prompt,
    type: 'choice',
    options: choices,
    next: step.next,
    rule: step.rule,
    content_source: step.content_source
  };
  renderChoice(syntheticStep);
  // Store the original step reference for answer retrieval
  currentStepId = step.id;
}

// ============================================================
// FOCUS HELPERS
// ============================================================
function selectOption(btn, val) {
  var opts = document.querySelectorAll('#options .focusable');
  for (var i = 0; i < opts.length; i++) {
    var isSelected = opts[i].getAttribute('data-val') === val;
    opts[i].classList.toggle('selected', isSelected);
    opts[i].setAttribute('aria-checked', isSelected ? 'true' : 'false');
  }
  btn.focus();
}

function selectChoiceOption(idx) {
  var opts = document.querySelectorAll('#options .focusable');
  for (var i = 0; i < opts.length; i++) {
    opts[i].classList.toggle('selected', i === idx);
    opts[i].setAttribute('aria-checked', i === idx ? 'true' : 'false');
  }
  if (opts[idx]) opts[idx].focus();
}

function adjustCount(dir) {
  var step = steps[currentStepId];
  if (!step) return;
  var delta = dir * (step.step || 0.1);
  countValue = Math.round((countValue + delta) * 10) / 10;
  countValue = Math.max(step.min || 0, Math.min(countValue, step.max || 10));
  document.getElementById('count-display').textContent = countValue.toFixed(1);
}

// ============================================================
// NAVIGATION
// ============================================================
function advance() {
  var step = steps[currentStepId];
  if (!step) return;

  var answer = getActiveAnswer();
  var nextStep = getNextStep(step, answer);

  answers[currentStepId] = answer;
  stepHistory.push(currentStepId);

  if (step.danger) {
    flags.push({
      stepId: currentStepId,
      type: step.id,
      description: step.prompt,
      referral: step.referral
    });
  }

  if (nextStep && steps[nextStep] && steps[nextStep].danger) {
    flags.push({
      stepId: nextStep,
      type: steps[nextStep].id,
      description: steps[nextStep].prompt,
      referral: steps[nextStep].referral
    });
    renderStep(nextStep);
  } else if (nextStep) {
    renderStep(nextStep);
  } else {
    renderComplete();
  }
}

function goBack() {
  if (stepHistory.length < 2) return;
  stepHistory.pop();
  window.history.back();
}

// ============================================================
// COMPLETION
// ============================================================
function renderComplete() {
  state = 'complete';
  completedAt = new Date().toLocaleTimeString();
  var durationMs = Date.now() - startedAt;
  var totalSec = Math.floor(durationMs / 1000);
  var min = Math.floor(totalSec / 60);
  var sec = totalSec % 60;
  var durStr = min === 0 ? sec + 's' : min + 'm ' + sec + 's';

  show('complete-area');
  document.getElementById('done-stats').textContent =
    stepHistory.length + ' steps · ' + flags.length + ' flags · ' + durStr;

  var visitLabel = activeProtocol ? activeProtocol.label : 'Unknown';
  saveCarryData(flags, visitLabel);

  var record = {
    protocolId: activeProtocol ? activeProtocol.id : null,
    protocol: visitLabel,
    answers: answers,
    flags: flags.map(function(f) { return { stepId: f.stepId, type: f.type, referral: f.referral }; }),
    stepCount: stepHistory.length,
    flagCount: flags.length,
    durationMs: durationMs,
    startedAt: new Date(startedAt).toISOString(),
    completedAt: completedAt
  };

  document.getElementById('done-sync').textContent = 'Open on phone to view record';
  try { localStorage.setItem('dastak_last_record', JSON.stringify(record)); } catch(e) {}

  clearResume();
  showControls('complete');
  updateProgress(getEffectiveTotalSteps(), getEffectiveTotalSteps());
  document.getElementById('step-info').textContent = '';

  if (!navigatingViaPopstate) {
    window.history.pushState({screen:'complete'}, '', '#complete');
  }
}

// ============================================================
// KEYBOARD HANDLER
// ============================================================
document.addEventListener('keydown', function(e) {
  switch (e.key) {
    case DPAD.UP:
      e.preventDefault();
      if (state === 'launch') break;
      if (state === 'complete') { renderLauncher(); break; }
      if (state === 'count') { adjustCount(1); break; }
      goBack();
      break;
    case DPAD.DOWN:
      e.preventDefault();
      if (state === 'count') { adjustCount(-1); break; }
      moveFocus('down');
      break;
    case DPAD.LEFT:
      e.preventDefault();
      if (state === 'launch') { cycleLaunch(-1); break; }
      if (state === 'step') { moveFocus('left'); break; }
      if (state === 'count') { adjustCount(-1); break; }
      break;
    case DPAD.RIGHT:
      e.preventDefault();
      if (state === 'launch') { cycleLaunch(1); break; }
      if (state === 'step') { moveFocus('right'); break; }
      if (state === 'count') { adjustCount(1); break; }
      break;
    case DPAD.SELECT:
      e.preventDefault();
      if (document.activeElement && document.activeElement.classList.contains('focusable')) {
        document.activeElement.click();
      } else if (state === 'danger' || state === 'info') {
        advance();
      }
      break;
    case DPAD.BACK:
      if (state !== 'launch' && currentStepId) {
        saveProgress();
      }
      history.back();
      break;
    default:
      return;
  }
});

function cycleLaunch(dir) {
  launchIndex = (launchIndex + dir + PROTOCOLS.length) % PROTOCOLS.length;
  var btns = document.querySelectorAll('#launch-options .focusable');
  selectLaunchOption(launchIndex);
  if (btns[launchIndex]) btns[launchIndex].focus();
}

// ============================================================
// AUDIO — two tones + speech
// ============================================================
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(function(){});
  return audioCtx;
}

function playTone(freq, duration, peakGain) {
  var ctx = ensureAudio(); if (!ctx) return;
  try {
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, ctx.currentTime + duration * 0.3);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + duration + 0.05);
  } catch(e) {}
}

function speak(text) {
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var el = document.getElementById('audio-indicator');
    if (el) el.style.display = 'flex';
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
    u.onend = function() { if (el) el.style.display = 'none'; };
    u.onerror = function() { if (el) el.style.display = 'none'; };
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

function playReferralTone() {
  if ('speechSynthesis' in window) speak('Refer to the health facility');
  else playTone(440, 0.35, 0.15);
}
function playCarryTone() {
  if ('speechSynthesis' in window) speak('Flagged last visit');
  else playTone(660, 0.12, 0.05);
}

// ============================================================
// INIT
// ============================================================
renderLauncher();
window.history.replaceState({screen:'launch'}, '', '#launch');

window.addEventListener('popstate', function(e) {
  navigatingViaPopstate = true;
  if (!e.state || e.state.screen === 'launch') {
    renderLauncher();
  } else if (e.state.screen === 'step' && e.state.stepId && steps[e.state.stepId]) {
    while (stepHistory.length > 0 && stepHistory[stepHistory.length - 1] !== e.state.stepId) {
      stepHistory.pop();
    }
    renderStep(e.state.stepId);
  } else if (e.state.screen === 'complete') {
    renderComplete();
  }
  navigatingViaPopstate = false;
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function() {});
}

var offlineMarker = document.getElementById('offline-marker');
function updateOnlineStatus() {
  if (!navigator.onLine) {
    offlineMarker.textContent = 'offline — saved locally';
    offlineMarker.style.display = '';
  } else {
    offlineMarker.style.display = 'none';
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
if (!navigator.onLine) updateOnlineStatus();
</script>
