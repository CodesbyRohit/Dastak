<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dastak - Day Planner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:ui-monospace,"SF Mono",Menlo,monospace;background:#000;color:#fff;min-height:100vh;padding:24px}
.header{border-bottom:1px solid #5A6570;padding-bottom:16px;margin-bottom:24px}
.header h1{font-size:20px;color:#00E5FF;letter-spacing:1px;text-transform:uppercase}
.header .sub{font-size:14px;color:#5A6570;margin-top:4px}
.visit-item{padding:16px;border:1px solid #5A6570;margin-bottom:12px}
.visit-item .vid{font-size:18px;color:#fff}
.visit-item .vproto{font-size:14px;color:#5A6570;margin-top:4px}
.visit-item .vreason{font-size:14px;color:#00E5FF;margin-top:4px}
.visit-note{font-size:14px;color:#5A6570;padding:16px 0;text-align:center}
.confidence-line{font-size:14px;padding:12px 16px;margin-bottom:24px;border-left:2px solid #5A6570}
.confidence-line.ai{border-color:#00E5FF;color:#00E5FF}
.confidence-line.offline{border-color:#5A6570;color:#5A6570}
.confidence-line.sparse{border-color:#E5484D;color:#E5484D}
.loading{text-align:center;padding:48px 0;color:#5A6570;font-size:16px}
.start-btn{display:block;width:100%;padding:16px;background:#000;border:1px solid #00E5FF;color:#00E5FF;font-size:20px;font-family:inherit;cursor:pointer;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="header">
  <h1>Day Planner</h1>
  <div class="sub">Ordered visits for today</div>
</div>
<div id="content"><div class="loading">Loading plan...</div></div>
<script>
var content = document.getElementById('content');
var roster = [
  {"id":"H-104","area":"Sector 3","protocol":"HBNC Day 7","dueIn":0,"lastFlag":"low temp"},
  {"id":"H-112","area":"Sector 3","protocol":"HBNC Day 21","dueIn":1,"lastFlag":null},
  {"id":"H-087","area":"Sector 7","protocol":"ANC month 6","dueIn":-2,"lastFlag":null},
  {"id":"H-201","area":"Sector 5","protocol":"HBNC Day 14","dueIn":0,"lastFlag":null},
  {"id":"H-098","area":"Sector 3","protocol":"HBNC Day 7","dueIn":-1,"lastFlag":"feeding difficulty"},
  {"id":"H-155","area":"Sector 7","protocol":"HBNC Day 21","dueIn":0,"lastFlag":null}
];

function render(orders, note, offline) {
  var html = '';

  // Property 5: Calibrated confidence — show how the plan was made
  var confClass = offline ? 'offline' : 'ai';
  var confLabel = offline ? 'Planned offline. Sorted by due date.' : 'Planned for today.';
  if (orders.length <= 1) {
    confClass = 'sparse';
    confLabel = 'Not enough scheduled visits to plan. Showing all.';
  }
  if (note) confLabel = note;
  html += '<div class="confidence-line ' + confClass + '">' + confLabel + '</div>';

  for (var i = 0; i < orders.length; i++) {
    var o = orders[i];
    var ri = roster.find(function(r) { return r.id === o.id; });
    html += '<div class="visit-item">';
    html += '<div class="vid">' + (i + 1) + '. ' + o.id + '</div>';
    html += '<div class="vproto">' + (ri ? ri.protocol : '') + '</div>';
    html += '<div class="vreason">' + o.reason + '</div>';
    html += '</div>';
  }
  html += '<button class="start-btn" onclick="window.location.href=\'/glasses.html\'">Start day</button>';
  content.innerHTML = html;
}

function fallbackSort() {
  var ordered = roster.slice().sort(function(a, b) {
    if (a.dueIn < 0 && b.dueIn >= 0) return -1;
    if (a.dueIn >= 0 && b.dueIn < 0) return 1;
    if (a.dueIn < 0 && b.dueIn < 0) return a.dueIn - b.dueIn;
    if (a.lastFlag && !b.lastFlag) return -1;
    if (!a.lastFlag && b.lastFlag) return 1;
    if (a.dueIn === 0 && b.dueIn > 0) return -1;
    if (a.dueIn > 0 && b.dueIn === 0) return 1;
    return a.dueIn - b.dueIn;
  }).map(function(h) {
    var reason = h.dueIn < 0 ? 'overdue by ' + Math.abs(h.dueIn) + ' day' + (Math.abs(h.dueIn) > 1 ? 's' : '')
      : h.lastFlag ? 'flagged last visit'
      : h.dueIn === 0 ? 'due today'
      : 'due in ' + h.dueIn + ' day' + (h.dueIn > 1 ? 's' : '');
    return { id: h.id, reason: reason };
  });
  render(ordered, 'Planned offline (deterministic sort)', true);
}

var xhr = new XMLHttpRequest();
xhr.open('POST', '/api/plan', true);
xhr.setRequestHeader('Content-Type', 'application/json');
xhr.onreadystatechange = function() {
  if (xhr.readyState === 4) {
    try {
      var data = JSON.parse(xhr.responseText);
      render(data.order, data.note, data.offline);
    } catch(e) {
      fallbackSort();
    }
  }
};
xhr.onerror = function() { fallbackSort(); };
xhr.timeout = 5000;
xhr.ontimeout = function() { fallbackSort(); };
xhr.send(JSON.stringify({ roster: roster }));
</script>
</body>
</html>
